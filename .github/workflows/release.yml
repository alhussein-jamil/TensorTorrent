name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag matching project version (e.g. v0.3.1)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve.outputs.tag }}
      - name: Check release tag
        run: python3 tools/check_version.py --tag "${{ steps.resolve.outputs.tag }}"

  wheels:
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            python: "3.10"
          - os: ubuntu-latest
            target: x86_64
            python: "3.11"
          - os: ubuntu-latest
            target: x86_64
            python: "3.12"
            sdist: true
          - os: ubuntu-latest
            target: x86_64
            python: "3.13"
          - os: ubuntu-24.04-arm
            target: aarch64
            python: "3.12"
          - os: ubuntu-24.04-arm
            target: aarch64
            python: "3.13"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: >-
            --release
            --out dist
            -i python${{ matrix.python }}
            --compatibility pypi
      - name: Build sdist
        if: matrix.sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}-cp${{ matrix.python }}
          path: dist/*
          if-no-files-found: error

  publish-github:
    needs: [validate, wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Build release notes
        run: python3 tools/changelog_notes.py --tag "${{ needs.validate.outputs.tag }}" --repo "${{ github.repository }}" > /tmp/release-notes.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          test -n "$(find dist -maxdepth 1 -type f | head -1)"
          title="TensorTorrent ${RELEASE_TAG#v}"
          if gh release view "${RELEASE_TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/* \
              --repo "${{ github.repository }}" \
              --clobber
            gh release edit "${RELEASE_TAG}" \
              --repo "${{ github.repository }}" \
              --title "${title}" \
              --notes-file /tmp/release-notes.md
          else
            gh release create "${RELEASE_TAG}" dist/* \
              --repo "${{ github.repository }}" \
              --title "${title}" \
              --notes-file /tmp/release-notes.md
          fi

  publish-pypi:
    needs: wheels
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/tensortorrent
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
