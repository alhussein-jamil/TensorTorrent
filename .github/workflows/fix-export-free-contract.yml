name: Fix export-free contract

on:
  push:
    branches:
      - "agent/fix-export-free-contract"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/fix-export-free-contract
          fetch-depth: 0
      - name: Save patch scripts
        run: |
          cp tools/_fix_export_free_contract_once.py /tmp/fix_export_free_contract.py
          cp tools/_fix_export_free_contract_tests_once.py /tmp/fix_export_free_contract_tests.py
      - name: Switch to main
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - uses: dtolnay/rust-toolchain@1.85.1
        with:
          components: rustfmt, clippy
      - name: Install test environment
        run: |
          uv sync --extra dev --no-install-package torch
          uv pip install "torch>=2.9" --index-url https://download.pytorch.org/whl/cpu
      - name: Apply audited fix
        run: |
          python /tmp/fix_export_free_contract.py
          python /tmp/fix_export_free_contract_tests.py
      - name: Format and lint touched Python
        run: |
          uv run ruff format python/tensortorrent/runtime/capacity.py python/tensortorrent/runtime/module.py tests/unit/test_export_free_contract.py
          uv run ruff check python/tensortorrent/runtime/capacity.py python/tensortorrent/runtime/module.py tests/unit/test_export_free_contract.py
          git diff --check
      - name: Targeted regression tests
        run: |
          uv run pytest -q \
            tests/unit/test_export_free_contract.py \
            tests/unit/test_capacity_ledger.py \
            tests/unit/test_eager_fallback_semantics.py \
            tests/unit/test_runtime_lifecycle_hardening.py
      - name: Commit and push main
        run: |
          git config user.name "alhussein-jamil"
          git config user.email "alhussein-jamil@users.noreply.github.com"
          git add python/tensortorrent/runtime/capacity.py python/tensortorrent/runtime/module.py tests/unit/test_export_free_contract.py
          git diff --cached --quiet && { echo "no changes produced"; exit 1; }
          git commit -m "fix: preserve export-free state contract"
          git push origin HEAD:main
