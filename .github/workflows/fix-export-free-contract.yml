name: Fix export-free contract

on:
  push:
    branches: [agent/fix-export-free-contract]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - uses: dtolnay/rust-toolchain@1.85.1
        with:
          components: rustfmt, clippy
      - name: Install test environment
        run: |
          uv sync --extra dev --no-install-package torch
          uv pip install "torch>=2.9" --index-url https://download.pytorch.org/whl/cpu
      - name: Apply audited fix
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one occurrence, found {count}")
              p.write_text(text.replace(old, new, 1))

          cap_path = Path("python/tensortorrent/runtime/capacity.py")
          cap = cap_path.read_text()
          marker = "\n\ndef _resident_device_parameter_bytes(\n"
          if cap.count(marker) != 1:
              raise SystemExit("capacity helper insertion point changed")
          helper = '''


def _program_state_bytes(program: Any | None) -> int:
    """Return resident state bytes, including export-free fused CPU roots.

    Export-free DirectPlan programs intentionally have no state bindings because
    they execute the caller's original ``nn.Module`` directly. Their generic
    ``total_state_bytes()`` is therefore zero even though the weights remain
    resident in host RAM. Count those tensors from the root so explicit RAM
    ceilings remain truthful.
    """
    if program is None:
        return 0
    state_bytes = int(program.total_state_bytes())
    if state_bytes > 0:
        return state_bytes
    metadata = getattr(program, "metadata", None) or {}
    if not isinstance(metadata, dict) or not metadata.get("eager_fused_export_free"):
        return 0
    root = getattr(program, "root", None)
    import torch

    if not isinstance(root, torch.nn.Module):
        return 0
    return sum(int(t.numel()) * int(t.element_size()) for t in (*root.parameters(), *root.buffers()))
'''
          cap = cap.replace(marker, helper + marker, 1)
          old = "    state_bytes = int(program.total_state_bytes()) if program is not None else 0\n"
          new = "    state_bytes = _program_state_bytes(program)\n"
          if cap.count(old) != 1:
              raise SystemExit("capacity state byte source changed")
          cap = cap.replace(old, new, 1)
          old = '    if not streaming and hasattr(config, "ram_budget_bytes"):\n'
          new = '    if parameter_store is None and not streaming and hasattr(config, "ram_budget_bytes"):\n'
          if cap.count(old) != 1:
              raise SystemExit("capacity streaming inference shape changed")
          cap = cap.replace(old, new, 1)
          cap_path.write_text(cap)

          module_path = Path("python/tensortorrent/runtime/module.py")
          module = module_path.read_text()
          state_marker = "    def state_dict(self, *args: Any, **kwargs: Any) -> Any:\n"
          if module.count(state_marker) != 1:
              raise SystemExit("CompiledModule.state_dict shape changed")
          helper_method = '''    def _uses_export_free_eager_root(self) -> bool:
        meta = getattr(self._program, "metadata", None) or {}
        return bool(isinstance(meta, dict) and meta.get("eager_fused_export_free"))

'''
          module = module.replace(state_marker, helper_method + state_marker, 1)
          state_start = module.index(state_marker)
          restore_marker = "\n    def _restore_sharded_state_dict"
          state_end = module.index(restore_marker, state_start)
          state_section = module[state_start:state_end]
          acquire = "        executor = self._executor_generations.acquire()\n"
          if state_section.count(acquire) != 1:
              raise SystemExit("state_dict executor acquisition shape changed")
          export_free_state = '''        if self._uses_export_free_eager_root():
            if len(args) > 3:
                raise TypeError(f"state_dict() takes at most 3 positional arguments but {len(args)} were given")
            names = ("destination", "prefix", "keep_vars")
            options: dict[str, Any] = {
                "destination": None,
                "prefix": "",
                "keep_vars": False,
            }
            for index, value in enumerate(args):
                name = names[index]
                if name in kwargs:
                    raise TypeError(f"state_dict() got multiple values for argument {name!r}")
                options[name] = value
            unknown = set(kwargs) - set(names)
            if unknown:
                name = sorted(unknown)[0]
                raise TypeError(f"state_dict() got an unexpected keyword argument {name!r}")
            options.update(kwargs)
            return self.graph_module.state_dict(
                destination=options["destination"],
                prefix=f"{options['prefix']}graph_module.",
                keep_vars=bool(options["keep_vars"]),
            )

'''
          state_section = state_section.replace(acquire, export_free_state + acquire, 1)
          module = module[:state_start] + state_section + module[state_end:]

          load_method = '''
    def load_state_dict(self, state_dict: Any, strict: bool = True, assign: bool = False) -> Any:
        """Load weights while preserving the export-free caller-module contract."""
        if not self._uses_export_free_eager_root():
            return torch.nn.Module.load_state_dict(self, state_dict, strict=strict, assign=assign)

        from collections import OrderedDict

        prefix = "graph_module."
        payload = OrderedDict()
        for key, value in state_dict.items():
            name = str(key)
            payload[name[len(prefix) :] if name.startswith(prefix) else name] = value

        metadata = getattr(state_dict, "_metadata", None)
        if metadata is not None:
            payload._metadata = {}  # type: ignore[attr-defined]
            for key, value in metadata.items():
                name = str(key)
                if name == "graph_module":
                    name = ""
                elif name.startswith(prefix):
                    name = name[len(prefix) :]
                payload._metadata[name] = value  # type: ignore[attr-defined]

        return self.graph_module.load_state_dict(payload, strict=strict, assign=assign)
'''
          if module.count(restore_marker) != 1:
              raise SystemExit("state_dict restore insertion point changed")
          module = module.replace(restore_marker, load_method + restore_marker, 1)
          module_path.write_text(module)

          test_path = Path("tests/unit/test_export_free_contract.py")
          if test_path.exists():
              raise SystemExit("export-free contract regression file already exists")
          test_path.write_text('''"""Regression coverage for export-free fused CPU state and capacity semantics."""

from __future__ import annotations

import pytest
import torch
import torch.nn as nn

from tensortorrent.compile.eager_cpu import build_eager_fused_compiled_module, module_parameter_bytes
from tensortorrent.config import CompileConfig
from tensortorrent.errors import MemoryCapacityError


def _build(model: nn.Module, x: torch.Tensor, *, ram_budget_bytes: int):
    state_bytes = module_parameter_bytes(model)
    config = CompileConfig(
        allow_cpu=True,
        allow_gpu=True,
        allow_nvme_streaming=True,
        ram_budget_bytes=ram_budget_bytes,
        vram_budget_bytes=1,
        host_memory_reserve_bytes=0,
        use_torch_compile=False,
        measure_regions=False,
        validate_numerics=False,
    )
    guard = {
        "cpu_fused_s": 0.001,
        "streamed_predicted_s": 1.0,
        "param_bytes": state_bytes,
        "selected": "cpu",
    }
    return build_eager_fused_compiled_module(
        model,
        (x,),
        config=config,
        name="export_free_contract",
        guard=guard,
    )


def test_export_free_explicit_ram_budget_reserves_resident_weights() -> None:
    model = nn.Sequential(nn.Linear(16, 16), nn.ReLU(), nn.Linear(16, 4)).eval()
    x = torch.randn(2, 16)
    state_bytes = module_parameter_bytes(model)
    compiled = _build(model, x, ram_budget_bytes=state_bytes + 4096)
    try:
        assert compiled.capacity_ledger.budgets.host_bytes == 4096
        assert compiled.capacity_ledger.per_request.host_bytes >= 1
    finally:
        compiled.close()


def test_export_free_explicit_ram_budget_fails_closed_when_weights_do_not_fit() -> None:
    model = nn.Sequential(nn.Linear(16, 16), nn.ReLU(), nn.Linear(16, 4)).eval()
    x = torch.randn(2, 16)
    state_bytes = module_parameter_bytes(model)
    with pytest.raises(MemoryCapacityError, match="shared host reservation exceeds capacity"):
        _build(model, x, ram_budget_bytes=max(1, state_bytes - 1))


def test_export_free_state_dict_round_trip_uses_compiled_key_space() -> None:
    model = nn.Sequential(nn.Linear(16, 16), nn.ReLU(), nn.Linear(16, 4)).eval()
    x = torch.randn(2, 16)
    state_bytes = module_parameter_bytes(model)
    compiled = _build(model, x, ram_budget_bytes=state_bytes + (1 << 20))
    try:
        state = compiled.state_dict()
        eager_state = model.state_dict()
        assert set(state) == {f"graph_module.{key}" for key in eager_state}
        for key, value in eager_state.items():
            torch.testing.assert_close(state[f"graph_module.{key}"], value)

        changed = state.copy()
        weight_key = next(key for key, value in changed.items() if value.is_floating_point())
        changed[weight_key] = changed[weight_key].clone() + 0.25
        incompatible = compiled.load_state_dict(changed)
        assert incompatible.missing_keys == []
        assert incompatible.unexpected_keys == []
        eager_key = weight_key.removeprefix("graph_module.")
        torch.testing.assert_close(model.state_dict()[eager_key], changed[weight_key])
    finally:
        compiled.close()
''')
          PY
      - name: Format and lint touched Python
        run: |
          uv run ruff format python/tensortorrent/runtime/capacity.py python/tensortorrent/runtime/module.py tests/unit/test_export_free_contract.py
          uv run ruff check python/tensortorrent/runtime/capacity.py python/tensortorrent/runtime/module.py tests/unit/test_export_free_contract.py
          git diff --check
      - name: Targeted regression tests
        run: |
          uv run pytest -q \
            tests/unit/test_export_free_contract.py \
            tests/unit/test_capacity_ledger.py \
            tests/unit/test_eager_fallback_semantics.py \
            tests/unit/test_runtime_lifecycle_hardening.py
      - name: Commit and push main
        run: |
          git config user.name "alhussein-jamil"
          git config user.email "alhussein-jamil@users.noreply.github.com"
          git add python/tensortorrent/runtime/capacity.py python/tensortorrent/runtime/module.py tests/unit/test_export_free_contract.py
          git diff --cached --exit-code && { echo "no changes produced"; exit 1; } || true
          git commit -m "fix: preserve export-free state contract"
          git push origin HEAD:main
