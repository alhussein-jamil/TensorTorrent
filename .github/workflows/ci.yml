name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"
      - "CHANGELOG.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"
      - "CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check project version
        run: python3 tools/check_version.py

  test:
    needs: metadata
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
            torch_index: https://download.pytorch.org/whl/cpu
          - os: ubuntu-latest
            python-version: "3.13"
            torch_index: https://download.pytorch.org/whl/cpu
          - os: ubuntu-24.04-arm
            python-version: "3.13"
            torch_index: https://download.pytorch.org/whl/cpu
    env:
      PYO3_PYTHON: ${{ github.workspace }}/.venv/bin/python
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - uses: dtolnay/rust-toolchain@1.85.1
        with:
          components: rustfmt, clippy
      - name: Install
        run: |
          uv sync --extra dev --no-install-package torch
          uv pip install --index-url "${{ matrix.torch_index }}" torch
          uv sync --extra dev --reinstall-package tensortorrent
          uv run maturin develop
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Lint
        run: |
          uv run ruff check python tests tools
          uv run ruff format --check python tests tools
          cargo fmt --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Types
        if: matrix.python-version == '3.13'
        run: uv run mypy python
      - name: Rust tests
        run: |
          LIBDIR="$("$PYO3_PYTHON" -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR") or "")')"
          export LD_LIBRARY_PATH="${LIBDIR}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cargo test --workspace
      - name: Tests
        run: uv run pytest -q -m "not hardware"
      - name: Doctor
        run: uv run tensortorrent doctor
      - name: Wheel and sdist
        if: matrix.python-version == '3.13' && matrix.os == 'ubuntu-latest'
        run: |
          uv run maturin build --release -o dist
          ls -la dist
      - name: Clean wheel install and CLI smoke
        if: matrix.python-version == '3.13' && matrix.os == 'ubuntu-latest'
        run: |
          uv venv /tmp/tt-wheel-venv
          uv pip install --python /tmp/tt-wheel-venv/bin/python --index-url "${{ matrix.torch_index }}" torch
          uv pip install --python /tmp/tt-wheel-venv/bin/python dist/tensortorrent-*.whl
          /tmp/tt-wheel-venv/bin/tensortorrent doctor
          /tmp/tt-wheel-venv/bin/python -c "from tensortorrent.native import require_native; require_native(); import tensortorrent as tt; print(tt.__version__)"
      - name: Native extension gate
        run: make native-gate

  container:
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build production CPU image
        run: docker build --tag tensortorrent:ci .
      - name: Smoke production CPU image
        run: |
          docker run --rm tensortorrent:ci python -c "from tensortorrent.native import require_native; require_native(); print('native import OK')"
          docker run --rm tensortorrent:ci sh -c 'test "$(id -u)" -ne 0'
          docker run --rm tensortorrent:ci tensortorrent-serve --health

  container-cuda:
    needs: metadata
    runs-on: ubuntu-latest
    # CUDA image build only — no --gpus / nvidia runtime on hosted runners.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build production CUDA image
        run: docker build -f Dockerfile.cuda --tag tensortorrent:ci-cuda .
