name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
            torch_index: https://download.pytorch.org/whl/cpu
          - os: ubuntu-latest
            python-version: "3.12"
            torch_index: https://download.pytorch.org/whl/cpu
          - os: ubuntu-24.04-arm
            python-version: "3.12"
            torch_index: https://pypi.org/simple
    env:
      PYO3_PYTHON: ${{ github.workspace }}/.venv/bin/python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install
        run: |
          uv sync --extra dev --no-install-package torch
          uv pip install --index-url "${{ matrix.torch_index }}" torch
          uv sync --extra dev --reinstall-package streamcompiler
          uv run maturin develop
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Lint
        run: |
          uv run ruff check python tests
          uv run ruff format --check python tests
          cargo fmt --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Types
        # numpy's bundled stubs require 3.12+ syntax, so type-check on the newer job.
        if: matrix.python-version == '3.12'
        run: uv run mypy python
      - name: Rust tests
        run: cargo test --workspace
      - name: Tests
        run: uv run pytest -q -m "not hardware"
      - name: Doctor
        run: uv run streamcompiler doctor
      - name: Wheel and sdist
        if: matrix.python-version == '3.12'
        run: |
          uv run maturin build --release -o dist
          ls -la dist
      - name: Clean wheel install and CLI smoke
        if: matrix.python-version == '3.12'
        run: |
          uv venv /tmp/sc-wheel-venv
          UV_PROJECT_ENVIRONMENT=/tmp/sc-wheel-venv uv pip install --index-url "${{ matrix.torch_index }}" torch
          UV_PROJECT_ENVIRONMENT=/tmp/sc-wheel-venv uv pip install dist/streamcompiler-*.whl
          /tmp/sc-wheel-venv/bin/streamcompiler doctor
          /tmp/sc-wheel-venv/bin/python -c "from streamcompiler.native import require_native; require_native(); import streamcompiler as sc; print(sc.__version__)"
      - name: Native extension gate
        run: make native-gate

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production CPU image
        run: docker build --tag streamcompiler:ci .
      - name: Smoke production CPU image
        run: |
          docker run --rm streamcompiler:ci python -c "from streamcompiler.native import require_native; require_native(); print('native import OK')"
          docker run --rm streamcompiler:ci sh -c 'test "$(id -u)" -ne 0'
          docker run --rm streamcompiler:ci streamcompiler-serve --health
