name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install
        run: |
          uv sync --extra dev --no-install-package torch
          uv pip install --index-url https://download.pytorch.org/whl/cpu torch
          uv sync --extra dev --reinstall-package streamcompiler
          uv run maturin develop
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Lint
        run: |
          uv run ruff check python tests
          uv run ruff format --check python tests
          cargo fmt --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Types
        # numpy's bundled stubs require 3.12+ syntax, so type-check on the newer job.
        if: matrix.python-version == '3.12'
        run: uv run mypy python
      - name: Rust tests
        run: cargo test --workspace
      - name: Tests
        run: uv run pytest -q
      - name: Doctor
        run: uv run streamcompiler doctor
      - name: Wheel and sdist
        if: matrix.python-version == '3.12'
        run: |
          uv run maturin build --release -o dist
          ls -la dist
      - name: Clean wheel install and CLI smoke
        if: matrix.python-version == '3.12'
        run: |
          uv venv /tmp/sc-wheel-venv
          UV_PROJECT_ENVIRONMENT=/tmp/sc-wheel-venv uv pip install --index-url https://download.pytorch.org/whl/cpu torch
          UV_PROJECT_ENVIRONMENT=/tmp/sc-wheel-venv uv pip install dist/streamcompiler-*.whl
          /tmp/sc-wheel-venv/bin/streamcompiler doctor
          /tmp/sc-wheel-venv/bin/python -c "from streamcompiler.native import require_native; require_native(); import streamcompiler as sc; print(sc.__version__)"
      - name: Native extension gate
        run: make native-gate
