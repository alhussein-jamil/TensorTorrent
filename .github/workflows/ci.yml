name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -U pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Types
        # numpy's bundled stubs require 3.12+ syntax, so type-check on the newer job.
        if: matrix.python-version == '3.12'
        run: mypy src
      - name: Tests
        run: pytest -q
      - name: Doctor
        run: streamcompiler doctor
      - name: Wheel and sdist
        if: matrix.python-version == '3.12'
        run: |
          pip install build
          python -m build
          ls -la dist
      - name: Clean wheel install and CLI smoke
        if: matrix.python-version == '3.12'
        run: |
          python -m venv /tmp/sc-wheel-venv
          /tmp/sc-wheel-venv/bin/pip install --upgrade pip
          /tmp/sc-wheel-venv/bin/pip install --index-url https://download.pytorch.org/whl/cpu torch
          /tmp/sc-wheel-venv/bin/pip install dist/streamcompiler-*.whl
          /tmp/sc-wheel-venv/bin/streamcompiler doctor
          /tmp/sc-wheel-venv/bin/python -c "import streamcompiler as sc; print(sc.__version__ if hasattr(sc,'__version__') else 'ok')"
      - name: Native extension gate
        run: |
          # No native extension ships today (see docs/architecture.md). Fail loudly
          # if a native/ tree appears without a documented build path.
          make native-gate
