<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">StreamCompiler logo</title>
  <desc id="desc">Three data streams converge through a compiler pipeline.</desc>
  <defs>
    <linearGradient id="panel" x1="24" y1="20" x2="216" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172033"/>
      <stop offset="1" stop-color="#090E19"/>
    </linearGradient>
    <linearGradient id="stream" x1="42" y1="57" x2="194" y2="183" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.52" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="200" height="200" rx="52" fill="url(#panel)" filter="url(#shadow)"/>
  <path d="M58 63h35c20 0 25 28 45 28h44" fill="none" stroke="url(#stream)" stroke-width="12" stroke-linecap="round"/>
  <path d="M58 120h124" fill="none" stroke="url(#stream)" stroke-width="12" stroke-linecap="round"/>
  <path d="M58 177h35c20 0 25-28 45-28h44" fill="none" stroke="url(#stream)" stroke-width="12" stroke-linecap="round"/>

  <circle cx="58" cy="63" r="11" fill="#38BDF8"/>
  <circle cx="58" cy="120" r="11" fill="#818CF8"/>
  <circle cx="58" cy="177" r="11" fill="#A78BFA"/>
  <rect x="171" y="48" width="22" height="144" rx="11" fill="#F97316"/>
  <path d="M177 80h10M177 120h10M177 160h10" stroke="#FFF7ED" stroke-width="4" stroke-linecap="round"/>
</svg>
