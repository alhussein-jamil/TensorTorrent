<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 268" role="img" aria-labelledby="title desc">
  <title id="title">TensorTorrent compilation and execution pipeline</title>
  <desc id="desc">Portable compilation produces a reusable artifact; machine specialization profiles, plans, simulates, compiles the winner, then runs it.</desc>
  <defs>
    <linearGradient id="panel" x1="56" y1="20" x2="1060" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172033"/>
      <stop offset="1" stop-color="#090E19"/>
    </linearGradient>
    <linearGradient id="stream" x1="78" y1="168" x2="1000" y2="168" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58B0D0"/>
      <stop offset="1" stop-color="#8058C0"/>
    </linearGradient>
  </defs>

  <rect width="1120" height="268" rx="28" fill="url(#panel)"/>

  <!-- phase cells: fill only, no stroke/top bar -->
  <rect x="28" y="56" width="300" height="188" rx="18" fill="#0B101C"/>
  <rect x="352" y="56" width="532" height="188" rx="18" fill="#0B101C"/>
  <rect x="908" y="56" width="184" height="188" rx="18" fill="#0B101C"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="48" y="88" fill="#8B93A8" font-size="12" font-weight="700" letter-spacing="0.08em">1 · PORTABLE</text>
    <text x="372" y="88" fill="#8B93A8" font-size="12" font-weight="700" letter-spacing="0.08em">2 · SPECIALIZE</text>
    <text x="928" y="88" fill="#8B93A8" font-size="12" font-weight="700" letter-spacing="0.08em">3 · RUN</text>

    <path d="M78 168 H1000" fill="none" stroke="url(#stream)" stroke-width="3" stroke-linecap="round"/>

    <g fill="#FFFFFF" font-size="13" font-weight="600" text-anchor="middle">
      <circle cx="78" cy="168" r="6.5" fill="#58B0D0"/><text x="78" y="142">Module</text>
      <circle cx="178" cy="168" r="6.5" fill="#58B0D0"/><text x="178" y="142">Export</text>
      <circle cx="278" cy="168" r="6.5" fill="#58B0D0"/><text x="278" y="142">Artifact</text>

      <circle cx="420" cy="168" r="6.5" fill="#6A90D4"/><text x="420" y="142">Profile</text>
      <circle cx="540" cy="168" r="6.5" fill="#6A90D4"/><text x="540" y="142">Plan</text>
      <circle cx="660" cy="168" r="6.5" fill="#6A90D4"/><text x="660" y="142">Simulate</text>
      <circle cx="780" cy="168" r="6.5" fill="#6A90D4"/><text x="780" y="142">Compile</text>

      <circle cx="1000" cy="168" r="7.5" fill="#8058C0"/><text x="1000" y="142">Runtime</text>
    </g>

    <g fill="#6E7690" font-size="11" text-anchor="middle">
      <text x="78" y="198">+ examples</text>
      <text x="178" y="198">export / FX</text>
      <text x="278" y="198">regions · packs</text>
      <text x="420" y="198">compute · links</text>
      <text x="540" y="198">Rust top-K</text>
      <text x="660" y="198">DES finalists</text>
      <text x="780" y="198">winner only</text>
      <text x="1000" y="198">schedule · I/O</text>
    </g>

    <path d="M328 160 l10 8 -10 8" fill="none" stroke="#3A4260" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M884 160 l10 8 -10 8" fill="none" stroke="#3A4260" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
