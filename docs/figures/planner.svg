<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 372" role="img" aria-labelledby="title desc">
  <title id="title">TensorTorrent planner and DES flow</title>
  <desc id="desc">Native beam search shortlists diverse top-K placements; discrete-event simulation ranks feasible schedule variants and picks the winner.</desc>
  <defs>
    <linearGradient id="panel" x1="40" y1="20" x2="880" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172033"/>
      <stop offset="1" stop-color="#090E19"/>
    </linearGradient>
  </defs>

  <rect width="920" height="372" rx="28" fill="url(#panel)"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="36" y="42" fill="#FFFFFF" font-size="18" font-weight="700">Planner → DES</text>
    <text x="36" y="62" fill="#6E7690" font-size="12">Cheap search shortlists · high-fidelity simulation selects</text>

    <rect x="28" y="84" width="420" height="268" rx="18" fill="#0B101C"/>
    <text x="48" y="116" fill="#8B93A8" font-size="12" font-weight="700" letter-spacing="0.08em">NATIVE SEARCH</text>

    <rect x="48" y="136" width="380" height="48" rx="12" fill="#121A2B"/>
    <text x="68" y="156" fill="#FFFFFF" font-size="13" font-weight="600">Planning problem</text>
    <text x="68" y="172" fill="#6E7690" font-size="11">regions · candidates · machine model</text>

    <rect x="48" y="196" width="380" height="48" rx="12" fill="#121A2B"/>
    <text x="68" y="216" fill="#FFFFFF" font-size="13" font-weight="600">Beam search + local improve</text>
    <text x="68" y="232" fill="#6E7690" font-size="11">Rayon · capacity + transfer-aware</text>

    <rect x="48" y="256" width="380" height="48" rx="12" fill="#121A2B"/>
    <text x="68" y="276" fill="#FFFFFF" font-size="13" font-weight="600">Diverse global top-K</text>
    <text x="68" y="292" fill="#6E7690" font-size="11">multiple placements per device subset</text>

    <rect x="48" y="316" width="380" height="22" rx="8" fill="#121A2B"/>
    <text x="238" y="332" text-anchor="middle" fill="#58B0D0" font-size="11" font-weight="600">finalists →</text>

    <rect x="472" y="84" width="420" height="268" rx="18" fill="#0B101C"/>
    <text x="492" y="116" fill="#8B93A8" font-size="12" font-weight="700" letter-spacing="0.08em">DISCRETE-EVENT SIM</text>

    <rect x="492" y="136" width="380" height="48" rx="12" fill="#121A2B"/>
    <text x="512" y="156" fill="#FFFFFF" font-size="13" font-weight="600">Schedule variants</text>
    <text x="512" y="172" fill="#6E7690" font-size="11">prefetch · staging · residency</text>

    <rect x="492" y="196" width="380" height="48" rx="12" fill="#121A2B"/>
    <text x="512" y="216" fill="#FFFFFF" font-size="13" font-weight="600">Batch DES</text>
    <text x="512" y="232" fill="#6E7690" font-size="11">contention · overlap · capacity</text>

    <rect x="492" y="256" width="380" height="48" rx="12" fill="#121A2B"/>
    <text x="512" y="276" fill="#FFFFFF" font-size="13" font-weight="600">Feasible? · rank by objective</text>
    <text x="512" y="292" fill="#6E7690" font-size="11">latency · throughput · memory · weighted</text>

    <rect x="492" y="316" width="380" height="22" rx="8" fill="#151028"/>
    <text x="682" y="332" text-anchor="middle" fill="#B898E8" font-size="11" font-weight="700">winning plan</text>

  </g>
</svg>
