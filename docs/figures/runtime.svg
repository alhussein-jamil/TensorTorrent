<svg xmlns="http://www.w3.org/2000/svg" width="880" height="270" viewBox="0 0 880 270" role="img" aria-label="TensorTorrent runtime: Rust authority and Python callbacks">
  <defs>
    <style type="text/css"><![CDATA[
      .frame { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; }
      .panel { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
      .rust { fill: #ffedd5; stroke: #ea580c; stroke-width: 1.5; }
      .py { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1.5; }
      .bag { fill: #ecfccb; stroke: #65a30d; stroke-width: 1.5; }
      .title { font: 700 13px DejaVu Sans, sans-serif; fill: #0f172a; }
      .item { font: 600 11px DejaVu Sans, sans-serif; fill: #0f172a; text-anchor: middle; }
      .sub { font: 500 10px DejaVu Sans, sans-serif; fill: #475569; text-anchor: middle; }
      .lbl { font: 600 9px DejaVu Sans, sans-serif; fill: #64748b; text-anchor: middle; }
      .note { font: 500 11px DejaVu Sans, sans-serif; fill: #334155; text-anchor: middle; }
      .edge { stroke: #475569; stroke-width: 1.75; fill: none; marker-end: url(#arrow); }
      .rail { stroke: #475569; stroke-width: 1.75; fill: none; }
      .auth { stroke: #ea580c; stroke-width: 1.6; stroke-dasharray: 5 4; fill: none; marker-end: url(#arrowOrange); }
    ]]></style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect width="880" height="270" rx="10" class="frame"/>

  <rect x="24" y="16" width="360" height="200" rx="10" class="panel"/>
  <text x="40" y="40" class="title">Rust (sole residency authority)</text>

  <rect x="44" y="52" width="320" height="36" rx="8" class="rust"/>
  <text x="204" y="74" class="item">dispatcher  (ExecutableSchedule)</text>

  <!-- fork rail: four peer subsystems -->
  <path class="rail" d="M204 88 V100"/>
  <path class="rail" d="M84 100 H324"/>
  <path class="edge" d="M84 100 V112"/>
  <path class="edge" d="M164 100 V112"/>
  <path class="edge" d="M244 100 V112"/>
  <path class="edge" d="M324 100 V112"/>

  <rect x="44" y="112" width="80" height="72" rx="8" class="rust"/>
  <text x="84" y="138" class="item">Residency</text>
  <text x="84" y="154" class="item">Store</text>
  <text x="84" y="172" class="sub">leases</text>

  <rect x="134" y="112" width="80" height="72" rx="8" class="rust"/>
  <text x="174" y="138" class="item">Streaming</text>
  <text x="174" y="154" class="item">Store</text>
  <text x="174" y="172" class="sub">pread</text>

  <rect x="224" y="112" width="80" height="72" rx="8" class="rust"/>
  <text x="264" y="138" class="item">Virtual</text>
  <text x="264" y="154" class="item">Backend</text>
  <text x="264" y="172" class="sub">mock</text>

  <rect x="314" y="112" width="80" height="72" rx="8" class="rust"/>
  <text x="354" y="138" class="item">spill</text>
  <text x="354" y="154" class="item">files</text>
  <text x="354" y="172" class="sub">activation</text>

  <path class="edge" d="M384 70 H456"/>
  <text x="420" y="62" class="lbl">batched</text>
  <text x="420" y="86" class="lbl">callbacks</text>

  <rect x="456" y="16" width="400" height="200" rx="10" class="panel"/>
  <text x="472" y="40" class="title">Python (GIL callbacks only)</text>

  <rect x="476" y="52" width="170" height="40" rx="8" class="py"/>
  <text x="561" y="70" class="item">Compute wave</text>
  <text x="561" y="84" class="sub">region kernels</text>

  <rect x="666" y="52" width="170" height="40" rx="8" class="py"/>
  <text x="751" y="70" class="item">param Load</text>
  <text x="751" y="84" class="sub">tensorize batch</text>

  <rect x="476" y="104" width="170" height="36" rx="8" class="py"/>
  <text x="561" y="126" class="item">handle release</text>

  <rect x="666" y="104" width="170" height="36" rx="8" class="py"/>
  <text x="751" y="126" class="item">copy sync</text>

  <rect x="476" y="156" width="360" height="40" rx="8" class="bag"/>
  <text x="656" y="174" class="item">CopyStore = passive handle to Tensor map</text>
  <text x="656" y="188" class="sub">not a residency system</text>

  <path class="auth" d="M124 184 C220 210 360 210 476 176"/>
  <text x="300" y="232" class="lbl">Rust owns validity / lifetime</text>

  <text x="440" y="254" class="note">One GIL per wave | fail closed on missing or stale copies | Python never invents residency</text>
</svg>
