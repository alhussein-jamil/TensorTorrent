<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">TensorTorrent runtime execution model</title>
  <desc id="desc">A Rust schedule dispatcher owns residency and I/O; compute workers run regions, calling into Python only when a torch region requires it.</desc>
  <defs>
    <linearGradient id="panel" x1="40" y1="20" x2="920" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172033"/>
      <stop offset="1" stop-color="#090E19"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7" fill="none" stroke="#4A5268" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrBrand" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7" fill="none" stroke="#8058C0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="960" height="300" rx="28" fill="url(#panel)"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="36" y="40" fill="#FFFFFF" font-size="18" font-weight="700">Runtime</text>
    <text x="36" y="60" fill="#6E7690" font-size="12">One immutable schedule · request-scoped ExecutionContext</text>

    <rect x="36" y="130" width="132" height="68" rx="14" fill="#0B101C"/>
    <text x="102" y="160" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">forward()</text>
    <text x="102" y="178" text-anchor="middle" fill="#6E7690" font-size="11">request</text>

    <path d="M176 164 H208" stroke="#4A5268" stroke-width="2" fill="none" marker-end="url(#arr)"/>

    <rect x="216" y="88" width="520" height="188" rx="18" fill="#0B101C"/>
    <text x="236" y="118" fill="#8B93A8" font-size="12" font-weight="700" letter-spacing="0.08em">RUST DISPATCHER</text>

    <rect x="240" y="140" width="148" height="52" rx="12" fill="#121A2B"/>
    <text x="314" y="162" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="600">Residency</text>
    <text x="314" y="178" text-anchor="middle" fill="#6E7690" font-size="11">leases · copies</text>

    <rect x="402" y="140" width="148" height="52" rx="12" fill="#121A2B"/>
    <text x="476" y="162" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="600">tt-storage</text>
    <text x="476" y="178" text-anchor="middle" fill="#6E7690" font-size="11">packs · spill I/O</text>

    <rect x="564" y="140" width="148" height="52" rx="12" fill="#121A2B"/>
    <text x="638" y="162" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="600">Workers</text>
    <text x="638" y="178" text-anchor="middle" fill="#6E7690" font-size="11">CPU / accel</text>

    <rect x="290" y="212" width="372" height="44" rx="12" fill="#121A2B" stroke="#403868" stroke-dasharray="5 4"/>
    <text x="476" y="230" text-anchor="middle" fill="#9488E2" font-size="12" font-weight="600">Torch region callback</text>
    <text x="476" y="246" text-anchor="middle" fill="#6E7690" font-size="11">Python only when required</text>

    <path d="M744 164 H780" stroke="#8058C0" stroke-width="2" fill="none" marker-end="url(#arrBrand)"/>

    <rect x="788" y="130" width="136" height="68" rx="14" fill="#0B101C"/>
    <text x="856" y="160" text-anchor="middle" fill="#B898E8" font-size="13" font-weight="700">outputs</text>
    <text x="856" y="178" text-anchor="middle" fill="#6E7690" font-size="11">tensors</text>

  </g>
</svg>
