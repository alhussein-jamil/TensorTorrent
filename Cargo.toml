[workspace]
resolver = "2"
members = [
    "crates/tt-ir",
    "crates/tt-memory",
    "crates/tt-runtime",
    "crates/tt-backend-api",
    "crates/tt-backend-cpu",
    "crates/tt-backend-virtual",
    "crates/tt-storage",
    "crates/tt-python",
]
default-members = [
    "crates/tt-ir",
    "crates/tt-memory",
    "crates/tt-runtime",
    "crates/tt-backend-api",
    "crates/tt-backend-cpu",
    "crates/tt-backend-virtual",
    "crates/tt-storage",
]

[workspace.package]
version = "0.2.5"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/alhussein-jamil/TensorTorrent"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.12"
crossbeam-channel = "0.5"
crossbeam-utils = "0.8"
rayon = "1.10"
tracing = "0.1"
libc = "0.2"
indexmap = { version = "2", features = ["serde"] }
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
tt-ir = { path = "crates/tt-ir" }
tt-memory = { path = "crates/tt-memory" }
tt-runtime = { path = "crates/tt-runtime" }
tt-backend-api = { path = "crates/tt-backend-api" }
tt-backend-cpu = { path = "crates/tt-backend-cpu" }
tt-backend-virtual = { path = "crates/tt-backend-virtual" }
tt-storage = { path = "crates/tt-storage" }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.release-quick]
inherits = "release"
lto = false
codegen-units = 16
