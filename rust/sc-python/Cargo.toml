[package]
name = "sc-python"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "PyO3 bindings for StreamCompiler native runtime"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
sc-ir = { workspace = true }
sc-memory = { workspace = true }
sc-runtime = { workspace = true }
sc-storage = { workspace = true }
sc-backend-api = { workspace = true }
sc-backend-cpu = { workspace = true }
sc-backend-virtual = { workspace = true }
pyo3 = { version = "0.23", default-features = true }
serde = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }
indexmap = { workspace = true }
